version: '3.8'

services:
  # Database Service
  db:
    image: postgres:15-alpine
    container_name: portfolio-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    security_opt:
      - no-new-privileges:true

  # Backend Service (.NET API)
  backend:
    build:
      context: ./PortfolioAPI
      dockerfile: Dockerfile
    container_name: portfolio-backend-prod
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY}
    depends_on:
      - db
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    security_opt:
      - no-new-privileges:true
    # Run as non-root is handled in Dockerfile
    read_only: true
    tmpfs:
      - /tmp

  # Frontend Service (Next.js)
  frontend:
    build:
      context: portfolio-app
      dockerfile: Dockerfile
    container_name: portfolio-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: always
    security_opt:
      - no-new-privileges:true
    # Run as non-root is handled in Dockerfile
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache

  # Nginx Gateway
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: portfolio-gateway-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - internal_network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    restart: always
    security_opt:
      - no-new-privileges:true

networks:
  internal_network:
    driver: bridge

volumes:
  postgres_data:
